# Modified for the source-focused edition, 12 November 2026.
name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check package, contracts and regressions
        run: python3 -B scripts/check_release.py
